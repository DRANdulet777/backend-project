version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/finance
      - SECRET_KEY=change_me
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    command: ["/app/entrypoint.sh"]

volumes:
  pgdata:
